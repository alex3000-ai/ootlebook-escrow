# The Escrow pilot: a frozen spec (SPEC.md) and tests, and a template to make them pass.
#   PATH="$HOME/.cargo/bin:$PATH" ./score.sh
[workspace]
resolver = "2"
members = ["template", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
tari_template_lib = "0.35"
tari_template_test_tooling = "0.47"
tari_ootle_transaction = "0.47"
tari_template_lib_types = "0.35"
tari_engine_types = "0.47"
# =0.24.0: tari_template_test_tooling 0.47.0 does not compile against 0.24.1.
tari_crypto = "=0.24.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
